          package com.example.designeditor

          import kotlinx.serialization.SerialName
          import kotlinx.serialization.Serializable
          import java.util.UUID

          fun newId(): String = UUID.randomUUID().toString()

          val PALETTE = listOf<Long>(
              0xFF000000, 0xFFFFFFFF, 0xFFE53935, 0xFFFB8C00, 0xFFFDD835, 0xFF43A047,
              0xFF00ACC1, 0xFF1E88E5, 0xFF5E35B1, 0xFFD81B60, 0xFF8D6E63, 0xFF607D8B,
          )

          enum class ShapeKind { RECT, ELLIPSE, TRIANGLE }

          @Serializable
          sealed interface Element {
              val id: String
              val x: Float
              val y: Float
              val w: Float
              val h: Float
              val rotation: Float
              val opacity: Float

              fun withTransform(
                  x: Float = this.x, y: Float = this.y,
                  w: Float = this.w, h: Float = this.h,
                  rotation: Float = this.rotation,
              ): Element

              fun withOpacity(o: Float): Element
              fun duplicated(): Element
          }

          @Serializable @SerialName("shape")
          data class ShapeElement(
              override val id: String, override val x: Float, override val y: Float,
              override val w: Float, override val h: Float, override val rotation: Float = 0f,
              override val opacity: Float = 1f,
              val kind: ShapeKind = ShapeKind.RECT,
              val color: Long = 0xFF6200EE, val corner: Float = 0f,
          ) : Element {
              override fun withTransform(x: Float, y: Float, w: Float, h: Float, rotation: Float) =
                  copy(x = x, y = y, w = w, h = h, rotation = rotation)
              override fun withOpacity(o: Float) = copy(opacity = o)
              override fun duplicated() = copy(id = newId(), x = x + 40f, y = y + 40f)
          }

          @Serializable @SerialName("text")
          data class TextElement(
              override val id: String, override val x: Float, override val y: Float,
              override val w: Float, override val h: Float, override val rotation: Float = 0f,
              override val opacity: Float = 1f,
              val text: String, val fontSize: Float = 64f, val color: Long = 0xFF000000,
              val bold: Boolean = false, val italic: Boolean = false,
              val align: Int = 0,            // 0 esquerda, 1 centro, 2 direita
              val family: String = "sans",   // sans, serif, mono
          ) : Element {
              // Ao redimensionar a altura, o tamanho da fonte acompanha.
              override fun withTransform(x: Float, y: Float, w: Float, h: Float, rotation: Float) =
                  copy(x = x, y = y, w = w, h = h, rotation = rotation,
                      fontSize = if (h != this.h && this.h > 0f) fontSize * h / this.h else fontSize)
              override fun withOpacity(o: Float) = copy(opacity = o)
              override fun duplicated() = copy(id = newId(), x = x + 40f, y = y + 40f)
          }

          @Serializable @SerialName("image")
          data class ImageElement(
              override val id: String, override val x: Float, override val y: Float,
              override val w: Float, override val h: Float, override val rotation: Float = 0f,
              override val opacity: Float = 1f,
              val path: String,
          ) : Element {
              override fun withTransform(x: Float, y: Float, w: Float, h: Float, rotation: Float) =
                  copy(x = x, y = y, w = w, h = h, rotation = rotation)
              override fun withOpacity(o: Float) = copy(opacity = o)
              override fun duplicated() = copy(id = newId(), x = x + 40f, y = y + 40f)
          }

          /** A ordem da lista é o z-index (o último fica por cima). */
          @Serializable
          data class Design(
              val id: String = "default",
              val width: Int = 1080,
              val height: Int = 1080,
              val background: Long = 0xFFFFFFFF,
              val elements: List<Element> = emptyList(),
              val version: Int = 2,
          )
