          cat > DesignEditor/app/src/main/java/com/example/designeditor/EditorViewModel.kt <<'EOF'
          package com.example.designeditor

          import android.app.Application
          import android.content.ContentValues
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.net.Uri
          import android.provider.MediaStore
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          data class EditorState(
              val design: Design = Design(),
              val selectedId: String? = null,
              val canUndo: Boolean = false,
              val canRedo: Boolean = false,
          )

          class EditorViewModel(private val app: Application) : AndroidViewModel(app) {
              private val storage = DesignStorage(File(app.filesDir, "designs").apply { mkdirs() })
              private val undoStack = ArrayDeque<Design>()
              private val redoStack = ArrayDeque<Design>()
              private var gestureStart: Design? = null
              private var saveJob: Job? = null

              private val _state = MutableStateFlow(EditorState())
              val state: StateFlow<EditorState> = _state.asStateFlow()

              init {
                  viewModelScope.launch {
                      storage.load("default")?.let { loaded -> _state.update { it.copy(design = loaded) } }
                  }
              }

              private val design get() = _state.value.design
              private val selected: Element?
                  get() = _state.value.let { s -> s.design.elements.firstOrNull { it.id == s.selectedId } }

              /** Texto: ajusta a altura da caixa ao conteúdo. */
              private fun fit(e: Element): Element = if (e is TextElement) e.copy(h = Renderer.fitHeight(e)) else e

              // ---------- histórico ----------
              private fun publish(d: Design, selectedId: String?) {
                  _state.value = EditorState(d, selectedId, undoStack.isNotEmpty(), redoStack.isNotEmpty())
                  scheduleSave()
              }

              /** Alteração discreta: guarda o estado anterior no histórico. */
              private fun commit(newDesign: Design, selectedId: String? = _state.value.selectedId) {
                  undoStack.addLast(design)
                  if (undoStack.size > 100) undoStack.removeFirst()
                  redoStack.clear()
                  publish(newDesign, selectedId)
              }

              fun undo() {
                  val prev = undoStack.removeLastOrNull() ?: return
                  redoStack.addLast(design)
                  publish(prev, _state.value.selectedId?.takeIf { id -> prev.elements.any { it.id == id } })
              }

              fun redo() {
                  val next = redoStack.removeLastOrNull() ?: return
                  undoStack.addLast(design)
                  publish(next, _state.value.selectedId?.takeIf { id -> next.elements.any { it.id == id } })
              }

              // ---------- gestos e sliders (alterações contínuas) ----------
              fun beginGesture() { if (gestureStart == null) gestureStart = design }

              /** Atualização em tempo real: sem histórico e sem gravar. */
              fun liveUpdate(e: Element) {
                  _state.update { s ->
                      s.copy(design = s.design.copy(elements = s.design.elements.map { if (it.id == e.id) e else it }))
                  }
              }

              /** Altera o elemento selecionado em tempo real (usado pelos sliders). */
              fun liveEdit(t: (Element) -> Element) {
                  val e = selected ?: return
                  liveUpdate(fit(t(e)))
              }

              /** Quando o dedo levanta, o gesto inteiro vira UM passo de undo. */
              fun endGesture() {
                  val start = gestureStart ?: return
                  gestureStart = null
                  val sel = _state.value.selectedId
                  val d = design.copy(elements = design.elements.map { if (it.id == sel) fit(it) else it })
                  if (start != d) {
                      undoStack.addLast(start)
                      redoStack.clear()
                      publish(d, sel)
                  } else {
                      _state.update { it.copy(design = d) }
                  }
              }

              // ---------- ações ----------
              fun select(id: String?) { _state.update { it.copy(selectedId = id) } }

              fun addShape(kind: ShapeKind) {
                  val d = design
                  val s = ShapeElement(newId(), (d.width - 400) / 2f, (d.height - 400) / 2f, 400f, 400f,
                      kind = kind, color = 0xFF1E88E5, corner = if (kind == ShapeKind.RECT) 24f else 0f)
                  commit(d.copy(elements = d.elements + s), s.id)
              }

              fun addText() {
                  val d = design
                  val t0 = TextElement(newId(), (d.width - 700) / 2f, (d.height - 100) / 2f, 700f, 100f, text = "Toque duas vezes para editar")
                  val t = t0.copy(h = Renderer.fitHeight(t0))
                  commit(d.copy(elements = d.elements + t), t.id)
              }

              fun addImage(uri: Uri) {
                  viewModelScope.launch(Dispatchers.IO) {
                      val dir = File(app.filesDir, "images").apply { mkdirs() }
                      val f = File(dir, "${newId()}.img")
                      val ok = app.contentResolver.openInputStream(uri)?.use { i -> f.outputStream().use { o -> i.copyTo(o) }; true } ?: false
                      if (!ok) return@launch
                      val b = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      BitmapFactory.decodeFile(f.path, b)
                      if (b.outWidth <= 0) return@launch
                      withContext(Dispatchers.Main) {
                          val d = design
                          val w = d.width * 0.6f
                          val h = w * b.outHeight / b.outWidth
                          val img = ImageElement(newId(), (d.width - w) / 2f, (d.height - h) / 2f, w, h, path = f.path)
                          commit(d.copy(elements = d.elements + img), img.id)
                      }
                  }
              }

              /** Alteração discreta no elemento selecionado (cor, negrito, alinhamento...). */
              fun edit(t: (Element) -> Element) {
                  val id = _state.value.selectedId ?: return
                  commit(design.copy(elements = design.elements.map { if (it.id == id) fit(t(it)) else it }))
              }

              fun updateText(id: String, text: String) {
                  commit(design.copy(elements = design.elements.map {
                      if (it.id == id && it is TextElement) fit(it.copy(text = text)) else it
                  }))
              }

              fun deleteSelected() {
                  val id = _state.value.selectedId ?: return
                  commit(design.copy(elements = design.elements.filterNot { it.id == id }), null)
              }

              fun duplicate() {
                  val e = selected ?: return
                  val c = e.duplicated()
                  commit(design.copy(elements = design.elements + c), c.id)
              }

              fun bringForward() = moveLayer(+1)
              fun sendBackward() = moveLayer(-1)

              private fun moveLayer(delta: Int) {
                  val id = _state.value.selectedId ?: return
                  val list = design.elements.toMutableList()
                  val i = list.indexOfFirst { it.id == id }
                  val j = i + delta
                  if (i < 0 || j < 0 || j >= list.size) return
                  val e = list.removeAt(i)
                  list.add(j, e)
                  commit(design.copy(elements = list))
              }

              fun setBackground(color: Long) { commit(design.copy(background = color)) }

              fun setPageSize(w: Int, h: Int) { commit(design.copy(width = w, height = h)) }

              fun applyTemplate(d: Design) { commit(d.copy(id = design.id), null) }

              // ---------- exportar PNG para a galeria ----------
              fun exportPng(onDone: (Boolean) -> Unit) {
                  val d = design
                  viewModelScope.launch(Dispatchers.IO) {
                      val ok = runCatching {
                          val bitmaps = HashMap<String, Bitmap?>()
                          d.elements.filterIsInstance<ImageElement>().forEach { bitmaps[it.path] = decodeScaled(it.path, 4096) }
                          val bmp = Bitmap.createBitmap(d.width, d.height, Bitmap.Config.ARGB_8888)
                          Renderer.draw(Canvas(bmp), d) { bitmaps[it] }
                          val values = ContentValues().apply {
                              put(MediaStore.Images.Media.DISPLAY_NAME, "design_${System.currentTimeMillis()}.png")
                              put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                              put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/DesignEditor")
                          }
                          val uri = app.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                              ?: error("sem uri")
                          val saved = app.contentResolver.openOutputStream(uri)?.use { out ->
                              bmp.compress(Bitmap.CompressFormat.PNG, 100, out)
                          } ?: false
                          saved
                      }.getOrDefault(false)
                      withContext(Dispatchers.Main) { onDone(ok) }
                  }
              }

              // ---------- persistência ----------
              private fun scheduleSave() {
                  saveJob?.cancel()
                  saveJob = viewModelScope.launch { delay(1000); storage.save(design) }
              }

              fun saveNow() {
                  saveJob?.cancel()
                  viewModelScope.launch { storage.save(design) }
              }
          }
