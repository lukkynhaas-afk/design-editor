          package com.example.designeditor

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.text.Layout
          import android.text.StaticLayout
          import android.text.TextPaint
          import kotlin.math.roundToInt

          /** Um único desenhador, usado no ecrã e na exportação (o PNG sai igual ao que se vê). */
          object Renderer {

              fun textLayout(e: TextElement, paint: TextPaint = TextPaint(Paint.ANTI_ALIAS_FLAG)): StaticLayout {
                  paint.textSize = e.fontSize
                  paint.color = e.color.toInt()
                  paint.alpha = (e.opacity * 255).roundToInt().coerceIn(0, 255)
                  val name = when (e.family) {
                      "serif" -> "serif"
                      "mono" -> "monospace"
                      else -> "sans-serif"
                  }
                  val style = (if (e.bold) Typeface.BOLD else 0) or (if (e.italic) Typeface.ITALIC else 0)
                  paint.typeface = Typeface.create(name, style)
                  val align = when (e.align) {
                      1 -> Layout.Alignment.ALIGN_CENTER
                      2 -> Layout.Alignment.ALIGN_OPPOSITE
                      else -> Layout.Alignment.ALIGN_NORMAL
                  }
                  val width = e.w.toInt().coerceAtLeast(1)
                  return StaticLayout.Builder.obtain(e.text, 0, e.text.length, paint, width)
                      .setAlignment(align)
                      .setIncludePad(false)
                      .build()
              }

              /** Altura que o texto realmente ocupa, para a caixa de seleção ficar justa. */
              fun fitHeight(e: TextElement): Float =
                  textLayout(e).height.toFloat().coerceAtLeast(e.fontSize)

              fun draw(c: Canvas, d: Design, bitmap: (String) -> Bitmap?) {
                  val fill = Paint(Paint.ANTI_ALIAS_FLAG)
                  val textPaint = TextPaint(Paint.ANTI_ALIAS_FLAG)
                  val bmpPaint = Paint(Paint.FILTER_BITMAP_FLAG)

                  fill.color = d.background.toInt()
                  c.drawRect(0f, 0f, d.width.toFloat(), d.height.toFloat(), fill)

                  c.save()
                  c.clipRect(0f, 0f, d.width.toFloat(), d.height.toFloat())
                  for (e in d.elements) {
                      c.save()
                      c.rotate(e.rotation, e.x + e.w / 2, e.y + e.h / 2)
                      val alpha = (e.opacity * 255).roundToInt().coerceIn(0, 255)
                      when (e) {
                          is ShapeElement -> {
                              fill.color = e.color.toInt()
                              fill.alpha = alpha
                              val r = RectF(e.x, e.y, e.x + e.w, e.y + e.h)
                              when (e.kind) {
                                  ShapeKind.RECT -> c.drawRoundRect(r, e.corner, e.corner, fill)
                                  ShapeKind.ELLIPSE -> c.drawOval(r, fill)
                                  ShapeKind.TRIANGLE -> {
                                      val p = Path()
                                      p.moveTo(e.x + e.w / 2, e.y)
                                      p.lineTo(e.x + e.w, e.y + e.h)
                                      p.lineTo(e.x, e.y + e.h)
                                      p.close()
                                      c.drawPath(p, fill)
                                  }
                              }
                          }
                          is TextElement -> {
                              val layout = textLayout(e, textPaint)
                              c.save()
                              c.translate(e.x, e.y)
                              layout.draw(c)
                              c.restore()
                          }
                          is ImageElement -> {
                              val bmp = bitmap(e.path)
                              if (bmp != null) {
                                  bmpPaint.alpha = alpha
                                  c.drawBitmap(bmp, null, RectF(e.x, e.y, e.x + e.w, e.y + e.h), bmpPaint)
                              }
                          }
                      }
                      c.restore()
                  }
                  c.restore()
              }
          }
